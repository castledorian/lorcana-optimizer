<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lorcana Card Viewer Pro</title>
    <style>
        :root {
            --bg-color: #0b0d12;
            --surface-color: #141822;
            --surface-card: #1c2230;
            --border-color: #2a3447;
            --accent-gold: #f5c451;
            --accent-gold-glow: rgba(245, 196, 81, 0.35);
            --text-main: #f0f4fc;
            --text-muted: #8c9ba5;
            --font-display: 'Georgia', 'Times New Roman', serif;
            --font-sans: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --color-amber: #ffaa00;
            --color-amethyst: #a855f7;
            --color-emerald: #10b981;
            --color-ruby: #ef4444;
            --color-sapphire: #3b82f6;
            --color-steel: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-sans);
            background: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(15, 19, 28, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-container {
            max-width: 1500px;
            margin: 0 auto;
            padding: 12px 20px;
        }
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand-icon { width: 28px; height: 28px; fill: var(--accent-gold); }
        .title {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 30%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .search-box {
            flex: 1;
            min-width: 240px;
            max-width: 480px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 9px 16px 9px 38px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: rgba(20, 24, 34, 0.8);
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .search-box input:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 12px var(--accent-gold-glow);
        }
        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            fill: var(--text-muted);
        }
        .lang-selector select {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--accent-gold);
            padding: 6px 28px 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            outline: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f5c451'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 6px center;
            background-size: 14px;
        }

        .header-filters {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: flex-end;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .filter-group label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .filter-group select {
            padding: 6px 26px 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--surface-color);
            color: var(--text-main);
            font-size: 13px;
            cursor: pointer;
            outline: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238c9ba5'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 6px center;
            background-size: 14px;
        }
        .filter-group select:focus, .filter-group select:hover {
            border-color: var(--accent-gold);
        }

        /* Rangée de boutons (couleurs, coûts, encre) */
        .icon-buttons {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        .color-btn {
            width: 32px;
            height: 32px;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            cursor: pointer;
            background-size: 22px 22px;
            background-repeat: no-repeat;
            background-position: center;
            background-color: var(--surface-color);
            transition: all 0.2s ease;
        }
        .color-btn.active {
            border-color: var(--accent-gold);
            transform: scale(1.1);
            box-shadow: 0 0 10px var(--accent-gold-glow);
        }
        .color-btn:hover {
            border-color: var(--accent-gold);
        }

        /* Boutons de coût hexagonaux */
        .cost-btn {
            width: 36px;
            height: 36px;
            border: none;
            cursor: pointer;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-color: transparent;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 14px;
            color: var(--accent-gold);
            transition: all 0.2s ease;
            filter: brightness(0.8);
        }
        .cost-btn:hover {
            filter: brightness(1.2);
        }
        .cost-btn.active {
            filter: brightness(1.4) drop-shadow(0 0 4px var(--accent-gold-glow));
        }

        /* Bouton Encre (toggle) */
        .inkable-btn {
            width: 36px;
            height: 36px;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            cursor: pointer;
            background-size: 28px 28px;
            background-repeat: no-repeat;
            background-position: center;
            background-color: var(--surface-color);
            transition: all 0.2s ease;
        }
        .inkable-btn.active {
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px var(--accent-gold-glow);
        }

        .clear-filters-btn {
            font-size: 12px;
            padding: 4px 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--surface-color);
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            line-height: 1;
        }
        .clear-filters-btn:hover {
            border-color: var(--accent-gold);
            color: #fff;
            background: rgba(245, 196, 81, 0.1);
        }

        .cards-grid {
            max-width: 1500px;
            margin: 20px auto;
            padding: 0 20px 40px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            flex: 1;
        }
        .card-frame {
            border-radius: 12px;
            padding: 2px;
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .card-frame:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        .card {
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }
        .card-image {
            width: 100%;
            aspect-ratio: 5/7;
            object-fit: contain;
            background: #0d1117;
            display: block;
        }

        .loading { text-align: center; padding: 60px; color: var(--text-muted); }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(245,196,81,0.2);
            border-top-color: var(--accent-gold);
            border-radius: 50%;
            animation: spin 1s infinite linear;
            margin: 0 auto 12px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .stats {
            max-width: 1500px;
            margin: 16px auto 0;
            padding: 0 20px;
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            font-size: 13px;
            color: var(--text-muted);
        }
        .stat-value { font-weight: 700; color: var(--accent-gold); font-size: 15px; }

        .pagination {
            max-width: 1500px;
            margin: 20px auto 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }
        .pagination button {
            padding: 8px 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--surface-color);
            color: var(--text-main);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .pagination button:hover:not(:disabled) {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }
        .pagination button:disabled { opacity: 0.3; cursor: default; }
        .page-info { color: var(--text-muted); font-size: 14px; }

        .footer {
            text-align: center;
            padding: 20px;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            margin-top: auto;
        }
        .footer a { color: var(--accent-gold); text-decoration: none; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4,6,10,0.88);
            backdrop-filter: blur(12px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--surface-color);
            border-radius: 18px;
            max-width: 950px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(245,196,81,0.1);
        }
        .modal-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: var(--surface-color);
            z-index: 10;
        }
        .modal-title {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-gold);
        }
        .close-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .close-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
        .modal-body {
            padding: 24px;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 28px;
        }
        @media (max-width: 768px) { .modal-body { grid-template-columns: 1fr; } }
        .modal-image {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .modal-details h3 {
            font-family: var(--font-display);
            color: var(--accent-gold);
            margin-bottom: 16px;
            font-size: 18px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 8px;
        }
        .modal-detail-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px 16px;
            margin-bottom: 16px;
        }
        .modal-detail { display: flex; flex-direction: column; gap: 2px; }
        .modal-detail-label { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        .modal-detail-value { color: var(--text-main); font-size: 14px; font-weight: 500; }
        .modal-text {
            background: rgba(0,0,0,0.3);
            border-left: 3px solid var(--accent-gold);
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            margin-top: 14px;
            font-style: italic;
            color: #d0d7e5;
            font-size: 14px;
            line-height: 1.5;
        }
        .modal-links { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .modal-links a {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .modal-links a:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            background: rgba(245,196,81,0.08);
        }
        .variant-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            padding: 16px;
            border-top: 1px solid var(--border-color);
            background: rgba(0,0,0,0.2);
        }
        .variant-nav button {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .variant-nav button:hover:not(:disabled) {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }
        .variant-nav button:disabled { opacity: 0.3; cursor: default; }
        .variant-count { font-size: 14px; color: var(--text-muted); font-weight: 500; }

        .error {
            text-align: center;
            padding: 30px 20px;
            color: #ef4444;
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 12px;
            max-width: 650px;
            margin: 40px auto;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="header-top">
                <div class="brand">
                    <svg class="brand-icon" viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
                    <div class="title" id="mainTitle">Lorcana Card Viewer</div>
                </div>
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    <input type="text" id="search" placeholder="Rechercher une carte...">
                </div>
                <div class="lang-selector">
                    <select id="language">
                        <option value="fr">FR</option>
                        <option value="en">EN</option>
                        <option value="de">DE</option>
                        <option value="it">IT</option>
                    </select>
                </div>
            </div>
            <div class="header-filters">
                <div class="filter-group">
                    <label for="set">Extension</label>
                    <select id="set"><option value="all">Toutes</option></select>
                </div>
                <div class="filter-group">
                    <label>Couleurs</label>
                    <div class="icon-buttons" id="colorButtonsContainer"></div>
                </div>
                <div class="filter-group">
                    <label>Coût</label>
                    <div class="icon-buttons" id="costButtonsContainer"></div>
                </div>
                <div class="filter-group">
                    <label>Encre</label>
                    <div class="icon-buttons" id="inkableButton"></div>
                </div>
                <div class="filter-group">
                    <label for="sort">Tri</label>
                    <select id="sort">
                        <option value="name-asc">Nom A-Z</option>
                        <option value="name-desc">Nom Z-A</option>
                        <option value="cost-asc">Coût ↑</option>
                        <option value="cost-desc">Coût ↓</option>
                    </select>
                </div>
                <button class="clear-filters-btn" id="resetFiltersBtn">✕ Réinitialiser</button>
            </div>
        </div>
    </header>

    <div class="stats" id="stats" style="display: none;">
        <div>Total : <span class="stat-value" id="totalCards">0</span></div>
        <div>Affichées : <span class="stat-value" id="displayedCards">0</span></div>
        <div>Extensions : <span class="stat-value" id="totalSets">0</span></div>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <span id="loadingText">Chargement des cartes...</span>
    </div>

    <div class="cards-grid" id="cardsGrid"></div>

    <div class="pagination" id="pagination" style="display: none;">
        <button id="prevPage">← Précédent</button>
        <span class="page-info" id="pageInfo">Page 1</span>
        <button id="nextPage">Suivant →</button>
    </div>

    <footer class="footer">
        Données fournies par <a href="https://lorcanajson.org" target="_blank">Lorcanajson.org</a> — Lorcana Card Viewer Pro
    </footer>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">Détails de la carte</div>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="variant-nav" id="variantNav" style="display: none;">
                <button id="prevVariant">← Variante précédente</button>
                <span class="variant-count" id="variantCount">1 / 1</span>
                <button id="nextVariant">Variante suivante →</button>
            </div>
        </div>
    </div>

        const inkwellSVG = "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 112"><path fill="#000" d="M63.6 16.5l29.4 17v34L63.6 89.5l-29.3-17v-34l29.3-16.9z"/><path fill="#d4b889" d="M63.6 16.5l34 19.6v39.1l-34 19.6-33.9-19.6V36.1l34-19.6zm0 5.2l29.4 17v34L63.6 89.5l-29.3-17v-34l29.3-16.9zM66.4 96.5L97 78.8a.6.6 0 01.9.6c-.6 5.4-2.9 19.9-8.5 24.8-.9.7-1.7 1.6-2.8 2.1a55 55 0 01-23 5h-.3a55.7 55.7 0 01-50-32 1 1 0 011.4-1.3 82 82 0 0033.4 11.4c.7 0 1.3.2 1.8.5l11.6 7s1 3.5 1.9 4.6c0 0 .5-2.2 3-5zM100 52.2a.6.6 0 01-.3-.5V39.4a.6.6 0 011-.5c5 2.9 16 15 14.1 38 0 .5 0 .8-.2 1.2A55.9 55.9 0 0198 99.4a.8.8 0 01-1.2-1 54 54 0 003.6-22v-18a391 391 0 014.4-3.7c-.7-.2-3.2-1.4-4.8-2.5zM10 70.1c-.5-1.9-1-3.7-1.2-5.7-1.2-4-6.3-7.4-8.4-8.6a.5.5 0 010-1c5.5-2.3 7.7-6 8.1-6.7A76 76 0 0027 75.8v.5c0 .4.1.7.4.8l15 7.7V86h-.1A61 61 0 019.9 70.1zM27.6 60v11.3c0 .3-.1.5-.4.6s-1.2-.3-1.4-.5c-1.7-1.8-4.4-5.3-9-12.2a36.1 36.1 0 01-6.5-19.3 55.8 55.8 0 0140-38.3.5.5 0 01.5.9 50.6 50.6 0 00-18 29.6L28 34.4a1 1 0 00-.4.8V52a20 20 0 01-5.3 2.5s4 3.2 5.2 5.5zm72.8-25a1 1 0 00-.5-.8L79.8 22.5a.3.3 0 01.1-.6c20.6-1.1 30.1 5.8 33.5 9l.4.7c2.5 5 4.1 10.5 5 16.3 0 0 2 4.3 8.2 7a.5.5 0 010 .9c-2.1 1.2-7.2 4.5-8.4 8.6a1 1 0 01-1.9 0c0-1.8-.2-3.7-.4-5.8A36.9 36.9 0 00100.4 35zM61.6 14.7L36.4 29a.3.3 0 01-.4-.3C39 13.7 52.5 4.4 55.8 2L58.5.3l.6-.1 4.5-.2h.4a55.6 55.6 0 0146.6 25.8v.4a66.9 66.9 0 00-36.1-6.8l-8.2-4.7c-1.7-1.9-2.7-5.4-2.7-5.4-1.4 1.1-2 5.4-2 5.4z"/></svg>`);

        let currentLanguage = 'fr';
        let allCards = [];
        let allSets = {};
        let currentPage = 1;
        const CARDS_PER_PAGE = 48;
        let uniqueCardList = [];
        let currentVariants = [];
        let currentVariantIndex = 0;

        const colorOrder = ['Amber', 'Amethyst', 'Emerald', 'Ruby', 'Sapphire', 'Steel'];
        let selectedColors = new Set();
        let selectedCosts = new Set();   // '1'...'8', '9+'
        let onlyInkable = false;        // true = n'afficher que les cartes encrables

        function getEnglishColorName(translated) {
            if (!translated) return '';
            const t = translations[currentLanguage].colorNames;
            for (const [eng, loc] of Object.entries(t)) {
                if (loc.toLowerCase() === String(translated).toLowerCase()) return eng;
            }
            return translated;
        }

        // Construction des boutons
        function buildColorButtons() {
            const container = document.getElementById('colorButtonsContainer');
            container.innerHTML = '';
            colorOrder.forEach(color => {
                const btn = document.createElement('div');
                btn.className = 'color-btn';
                btn.style.backgroundImage = `url('${colorSVGDataURIs[color]}')`;
                btn.title = translations[currentLanguage].colorNames[color] || color;
                btn.dataset.color = color;
                btn.addEventListener('click', () => toggleColor(color, btn));
                container.appendChild(btn);
            });
        }

        function buildCostButtons() {
            const container = document.getElementById('costButtonsContainer');
            container.innerHTML = '';
            for (let i = 1; i <= 8; i++) {
                const btn = document.createElement('div');
                btn.className = 'cost-btn';
                btn.style.backgroundImage = `url('${costHexSVG}')`;
                btn.textContent = i;
                btn.dataset.cost = i;
                btn.addEventListener('click', () => toggleCost(i, btn));
                container.appendChild(btn);
            }
            // Bouton 9+
            const btn9 = document.createElement('div');
            btn9.className = 'cost-btn';
            btn9.style.backgroundImage = `url('${costHexSVG}')`;
            btn9.textContent = '9+';
            btn9.dataset.cost = '9+';
            btn9.addEventListener('click', () => toggleCost('9+', btn9));
            container.appendChild(btn9);
        }

        function buildInkableButton() {
            const container = document.getElementById('inkableButton');
            container.innerHTML = '';
            const btn = document.createElement('div');
            btn.className = 'inkable-btn';
            btn.style.backgroundImage = `url('${inkwellSVG}')`;
            btn.title = 'Filtrer cartes encrables';
            btn.addEventListener('click', () => {
                onlyInkable = !onlyInkable;
                btn.classList.toggle('active');
                applyFiltersAndDisplay();
            });
            container.appendChild(btn);
        }

        function toggleColor(color, btn) {
            if (selectedColors.has(color)) {
                selectedColors.delete(color);
                btn.classList.remove('active');
            } else {
                selectedColors.add(color);
                btn.classList.add('active');
            }
            applyFiltersAndDisplay();
        }

        function toggleCost(cost, btn) {
            const key = String(cost);
            if (selectedCosts.has(key)) {
                selectedCosts.delete(key);
                btn.classList.remove('active');
            } else {
                selectedCosts.add(key);
                btn.classList.add('active');
            }
            applyFiltersAndDisplay();
        }

        function resetAllFilters() {
            selectedColors.clear();
            selectedCosts.clear();
            onlyInkable = false;
            document.querySelectorAll('.color-btn, .cost-btn, .inkable-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('set').value = 'all';
            document.getElementById('sort').value = 'name-asc';
            document.getElementById('search').value = '';
            applyFiltersAndDisplay();
        }

        function applyUILanguage(lang) {
            const t = translations[lang];
            document.getElementById('loadingText').textContent = t.loading;
            document.querySelector('#set option[value="all"]').textContent = t.allSets;
            document.querySelector('#cost option[value="all"]').textContent = t.allCosts;
            document.querySelector('#sort option[value="name-asc"]').textContent = t.sortNameAsc;
            document.querySelector('#sort option[value="name-desc"]').textContent = t.sortNameDesc;
            document.querySelector('#sort option[value="cost-asc"]').textContent = t.sortCostAsc;
            document.querySelector('#sort option[value="cost-desc"]').textContent = t.sortCostDesc;
            document.getElementById('prevPage').innerHTML = t.prevBtn;
            document.getElementById('nextPage').innerHTML = t.nextBtn;
            document.getElementById('modalTitle').textContent = t.modalTitle;
            document.getElementById('prevVariant').textContent = t.prevVariantText;
            document.getElementById('nextVariant').textContent = t.nextVariantText;
            updatePaginationText();
            document.querySelectorAll('.color-btn').forEach(btn => {
                const color = btn.dataset.color;
                btn.title = t.colorNames[color] || color;
            });
        }

        function updatePaginationText() {
            const t = translations[currentLanguage];
            const totalPages = Math.ceil(uniqueCardList.length / CARDS_PER_PAGE) || 1;
            if (totalPages > 1) {
                document.getElementById('pageInfo').textContent = `${t.page} ${currentPage} ${t.of} ${totalPages}`;
            }
        }

        // ---------- CHARGEMENT DES CARTES (fichier local par langue) ----------
        async function fetchCardsData(lang) {
            const url = `${lang}.json`;
            const res = await fetch(url);
            if (!res.ok) throw new Error(`Impossible de charger ${url} (status ${res.status})`);
            return await res.json();
        }

        async function loadCards(lang) {
            const loadingEl = document.getElementById('loading');
            loadingEl.innerHTML = `<div class="spinner"></div><span>${translations[lang].loading}</span>`;
            loadingEl.style.display = 'block';
            document.getElementById('error')?.remove();

            try {
                const data = await fetchCardsData(lang);
                allCards = data.cards || [];
                allSets = data.sets || {};
                allCards.forEach(card => {
                    const subtypes = card.subtypesText || (card.subtypes ? card.subtypes.join(' ') : '');
                    const artists = card.artistsText || (card.artists ? card.artists.join(' ') : '');
                    const story = card.story || '';
                    const flavor = card.flavorText || '';
                    card.searchText = `${card.name} ${card.version} ${card.fullName} ${card.simpleName} ${subtypes} ${artists} ${story} ${flavor}`.toLowerCase();
                });
                populateSetSelect();
                updateStats();
                applyFiltersAndDisplay();
                loadingEl.style.display = 'none';
                document.getElementById('stats').style.display = 'flex';
            } catch (err) {
                loadingEl.innerHTML = `
                    <div class="error">
                        <div style="font-weight:700;font-size:16px;margin-bottom:8px;">⚠️ Erreur de chargement</div>
                        <div style="font-size:13px;color:#fca5a5;margin-bottom:12px;">${err.message}</div>
                        <button onclick="loadCards('${lang}')" style="background:#ef4444;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:600;">Réessayer</button>
                    </div>
                `;
            }
        }

        function populateSetSelect() {
            const setSelect = document.getElementById('set');
            const t = translations[currentLanguage];
            setSelect.innerHTML = `<option value="all">${t.allSets}</option>`;
            Object.entries(allSets).forEach(([id, set]) => {
                const opt = document.createElement('option');
                opt.value = id;
                opt.textContent = `${set.number} - ${set.name}`;
                setSelect.appendChild(opt);
            });
        }

        function updateStats() {
            document.getElementById('totalCards').textContent = allCards.length;
            document.getElementById('totalSets').textContent = Object.keys(allSets).length;
        }

        function applyFiltersAndDisplay() {
            if (!allCards.length) return;
            const selectedSet = document.getElementById('set').value;
            const searchTerm = document.getElementById('search').value.toLowerCase().trim();
            const [sortField, sortOrder] = document.getElementById('sort').value.split('-');

            let filtered = allCards.slice();
            if (selectedSet !== 'all') filtered = filtered.filter(c => c.setCode === selectedSet);

            // Couleurs
            if (selectedColors.size > 0) {
                filtered = filtered.filter(c => {
                    const cardColors = c.color.split('-').map(x => getEnglishColorName(x.trim()));
                    return cardColors.some(color => selectedColors.has(color));
                });
            }

            // Coûts (union)
            if (selectedCosts.size > 0) {
                filtered = filtered.filter(c => {
                    const cost = c.cost || 0;
                    return [...selectedCosts].some(sc => {
                        if (sc === '9+') return cost >= 9;
                        return cost === parseInt(sc);
                    });
                });
            }

            // Encreable
            if (onlyInkable) {
                filtered = filtered.filter(c => c.inkwell === true);
            }

            // Recherche
            if (searchTerm) filtered = filtered.filter(c => c.searchText && c.searchText.includes(searchTerm));

            // Tri
            filtered.sort((a, b) => {
                let valA = sortField === 'name' ? (a.name || '').toLowerCase() : (a.cost || 0);
                let valB = sortField === 'name' ? (b.name || '').toLowerCase() : (b.cost || 0);
                if (valA < valB) return sortOrder === 'asc' ? -1 : 1;
                if (valA > valB) return sortOrder === 'asc' ? 1 : -1;
                return 0;
            });

            // Groupes (variantes)
            const groups = new Map();
            filtered.forEach(card => {
                const key = card.fullName || `${card.name} - ${card.version}`;
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(card);
            });
            uniqueCardList = Array.from(groups, ([, variants]) => ({ representative: variants[0], variants }));
            document.getElementById('displayedCards').textContent = uniqueCardList.length;
            currentPage = 1;
            renderPage();
        }

        function renderPage() {
            const totalPages = Math.ceil(uniqueCardList.length / CARDS_PER_PAGE) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            const start = (currentPage - 1) * CARDS_PER_PAGE;
            const pageCards = uniqueCardList.slice(start, start + CARDS_PER_PAGE);
            const grid = document.getElementById('cardsGrid');
            if (pageCards.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--text-muted)">Aucune carte trouvée</div>';
            } else {
                let html = '';
                pageCards.forEach(group => {
                    const card = group.representative;
                    const img = card.images?.thumbnail || card.images?.full || '';
                    const safeName = (card.fullName || card.name || '').replace(/"/g, '&quot;');
                    html += `<div class="card-frame" data-color="${card.color || ''}" data-fullname="${safeName}">
                        <div class="card"><img src="${img}" alt="${safeName}" class="card-image" loading="lazy"></div>
                    </div>`;
                });
                grid.innerHTML = html;
            }
            const pagDiv = document.getElementById('pagination');
            if (totalPages > 1) {
                pagDiv.style.display = 'flex';
                updatePaginationText();
                document.getElementById('prevPage').disabled = currentPage === 1;
                document.getElementById('nextPage').disabled = currentPage === totalPages;
            } else {
                pagDiv.style.display = 'none';
            }
        }

        function getColorStyle(colorField) {
            if (!colorField) return 'var(--accent-gold)';
            const colors = colorField.split('-').map(c => getEnglishColorName(c.trim()));
            const hexes = colors.map(c => colorHexMap[c]).filter(Boolean);
            if (hexes.length === 1) return hexes[0];
            if (hexes.length >= 2) return `linear-gradient(135deg, ${hexes[0]}, ${hexes[1]})`;
            return 'var(--accent-gold)';
        }

        // Événements
        document.getElementById('set').addEventListener('change', applyFiltersAndDisplay);
        document.getElementById('search').addEventListener('input', applyFiltersAndDisplay);
        document.getElementById('sort').addEventListener('change', applyFiltersAndDisplay);
        document.getElementById('language').addEventListener('change', (e) => {
            currentLanguage = e.target.value;
            applyUILanguage(currentLanguage);
            loadCards(currentLanguage);
        });
        document.getElementById('prevPage').addEventListener('click', () => {
            if (currentPage > 1) { currentPage--; renderPage(); window.scrollTo(0,0); }
        });
        document.getElementById('nextPage').addEventListener('click', () => {
            if (currentPage < Math.ceil(uniqueCardList.length / CARDS_PER_PAGE)) { currentPage++; renderPage(); window.scrollTo(0,0); }
        });
        document.getElementById('cardsGrid').addEventListener('click', (e) => {
            const frame = e.target.closest('.card-frame');
            if (!frame) return;
            const group = uniqueCardList.find(g => g.representative.fullName === frame.dataset.fullname);
            if (group) openVariantModal(group.variants, 0);
        });
        document.getElementById('cardsGrid').addEventListener('mouseover', (e) => {
            const frame = e.target.closest('.card-frame');
            if (!frame) return;
            frame.style.background = getColorStyle(frame.dataset.color || '');
        });
        document.getElementById('cardsGrid').addEventListener('mouseout', (e) => {
            const frame = e.target.closest('.card-frame');
            if (!frame) return;
            frame.style.background = '';
        });

        function openVariantModal(variants, index) {
            currentVariants = variants;
            currentVariantIndex = index;
            showVariantAtIndex();
            document.getElementById('modal').classList.add('active');
            document.getElementById('variantNav').style.display = variants.length > 1 ? 'flex' : 'none';
        }

        function showVariantAtIndex() {
            const card = currentVariants[currentVariantIndex];
            const t = translations[currentLanguage];
            document.getElementById('modalTitle').textContent = card.fullName || card.name;
            const img = card.images?.full || card.images?.thumbnail || '';
            const subtypes = card.subtypesText || (card.subtypes ? card.subtypes.join(' • ') : '-');
            const artists = card.artistsText || (card.artists ? card.artists.join(', ') : '-');
            const flavor = card.flavorText || '';
            const displayColor = card.color.split('-').map(c => t.colorNames[c] || c).join(' / ') || '-';
            const type = t.types[card.type] || card.type || '-';
            const rarity = t.rarities[card.rarity] || card.rarity || '-';
            const inkable = card.inkwell ? 'Encrable' : 'Non encrable';

            const html = `
                <div><img src="${img}" alt="${card.fullName}" class="modal-image"></div>
                <div class="modal-details">
                    <h3>${card.name || ''} ${card.version ? `<span style="font-size:14px;font-weight:normal;color:var(--text-muted)">— ${card.version}</span>` : ''}</h3>
                    <div class="modal-detail-grid">
                        <div class="modal-detail"><span class="modal-detail-label">Type</span><span class="modal-detail-value">${type}</span></div>
                        <div class="modal-detail"><span class="modal-detail-label">Sous-types</span><span class="modal-detail-value">${subtypes}</span></div>
                        <div class="modal-detail"><span class="modal-detail-label">Couleur</span><span class="modal-detail-value">${displayColor}</span></div>
                        <div class="modal-detail"><span class="modal-detail-label">Coût / Encre</span><span class="modal-detail-value">${card.cost || 0} (${inkable})</span></div>
                        ${card.strength !== undefined ? `<div class="modal-detail"><span class="modal-detail-label">Force</span><span class="modal-detail-value">${card.strength}</span></div>` : ''}
                        ${card.willpower !== undefined ? `<div class="modal-detail"><span class="modal-detail-label">Volonté</span><span class="modal-detail-value">${card.willpower}</span></div>` : ''}
                        ${card.lore !== undefined ? `<div class="modal-detail"><span class="modal-detail-label">Lore</span><span class="modal-detail-value">${card.lore}</span></div>` : ''}
                        <div class="modal-detail"><span class="modal-detail-label">Rareté</span><span class="modal-detail-value">${rarity}</span></div>
                        <div class="modal-detail"><span class="modal-detail-label">Extension</span><span class="modal-detail-value">${allSets[card.setCode]?.name || card.setCode || '-'}</span></div>
                        <div class="modal-detail"><span class="modal-detail-label">Numéro</span><span class="modal-detail-value">${card.number || '?'}/${allSets[card.setCode]?.cardCounts?.base || '?'}</span></div>
                        <div class="modal-detail"><span class="modal-detail-label">Artiste(s)</span><span class="modal-detail-value">${artists}</span></div>
                    </div>
                    ${flavor ? `<div class="modal-text">"${flavor}"</div>` : ''}
                    ${card.externalLinks ? `<div class="modal-links">${card.externalLinks.tcgPlayerUrl ? `<a href="${card.externalLinks.tcgPlayerUrl}" target="_blank">TCGPlayer ↗</a>` : ''}${card.externalLinks.cardmarketUrl ? `<a href="${card.externalLinks.cardmarketUrl}" target="_blank">Cardmarket ↗</a>` : ''}</div>` : ''}
                </div>`;
            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('variantCount').textContent = `${currentVariantIndex + 1} / ${currentVariants.length}`;
            document.getElementById('prevVariant').disabled = currentVariantIndex === 0;
            document.getElementById('nextVariant').disabled = currentVariantIndex === currentVariants.length - 1;
        }

        function closeModal() { document.getElementById('modal').classList.remove('active'); }
        document.getElementById('prevVariant').addEventListener('click', () => {
            if (currentVariantIndex > 0) { currentVariantIndex--; showVariantAtIndex(); }
        });
        document.getElementById('nextVariant').addEventListener('click', () => {
            if (currentVariantIndex < currentVariants.length - 1) { currentVariantIndex++; showVariantAtIndex(); }
        });
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modal')) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
            if (document.getElementById('modal').classList.contains('active')) {
                if (e.key === 'ArrowLeft') document.getElementById('prevVariant').click();
                if (e.key === 'ArrowRight') document.getElementById('nextVariant').click();
            }
        });

        // Initialisation
        function initApp() {
            buildColorButtons();
            buildCostButtons();
            buildInkableButton();
            applyUILanguage('fr');
            loadCards('fr');
            document.getElementById('resetFiltersBtn').addEventListener('click', resetAllFilters);
        }

        initApp();
    </script>
</body>
</html>
