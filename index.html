<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lorcana Card Viewer Pro</title>
    <style>
        :root {
            --bg-color: #0b0d12;
            --surface-color: #141822;
            --surface-card: #1c2230;
            --border-color: #2a3447;
            --accent-gold: #f5c451;
            --accent-gold-glow: rgba(245, 196, 81, 0.35);
            --text-main: #f0f4fc;
            --text-muted: #8c9ba5;
            --font-display: 'Georgia', 'Times New Roman', serif;
            --font-sans: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --color-amber: #ffaa00;
            --color-amethyst: #a855f7;
            --color-emerald: #10b981;
            --color-ruby: #ef4444;
            --color-sapphire: #3b82f6;
            --color-steel: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-sans);
            background: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(15, 19, 28, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-container {
            max-width: 1500px;
            margin: 0 auto;
            padding: 12px 20px;
        }
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand-icon { width: 28px; height: 28px; fill: var(--accent-gold); }
        .title {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 30%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .search-box {
            flex: 1;
            min-width: 240px;
            max-width: 480px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 9px 16px 9px 38px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: rgba(20, 24, 34, 0.8);
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .search-box input:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 12px var(--accent-gold-glow);
        }
        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            fill: var(--text-muted);
        }
        .lang-selector select {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--accent-gold);
            padding: 6px 28px 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            outline: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f5c451'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 6px center;
            background-size: 14px;
        }

        .header-filters {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: flex-end;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .filter-group label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .filter-group select {
            padding: 6px 26px 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--surface-color);
            color: var(--text-main);
            font-size: 13px;
            cursor: pointer;
            outline: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238c9ba5'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 6px center;
            background-size: 14px;
        }
        .filter-group select:focus, .filter-group select:hover {
            border-color: var(--accent-gold);
        }

        /* Rangée de boutons (couleurs, coûts, encre) */
        .icon-buttons {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        .color-btn {
            width: 32px;
            height: 32px;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            cursor: pointer;
            background-size: 22px 22px;
            background-repeat: no-repeat;
            background-position: center;
            background-color: var(--surface-color);
            transition: all 0.2s ease;
        }
        .color-btn.active {
            border-color: var(--accent-gold);
            transform: scale(1.1);
            box-shadow: 0 0 10px var(--accent-gold-glow);
        }
        .color-btn:hover {
            border-color: var(--accent-gold);
        }

        /* Boutons de coût hexagonaux */
        .cost-btn {
            width: 36px;
            height: 36px;
            border: none;
            cursor: pointer;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-color: transparent;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 14px;
            color: var(--accent-gold);
            transition: all 0.2s ease;
            filter: brightness(0.8);
        }
        .cost-btn:hover {
            filter: brightness(1.2);
        }
        .cost-btn.active {
            filter: brightness(1.4) drop-shadow(0 0 4px var(--accent-gold-glow));
        }

        /* Bouton Encre (toggle) */
        .inkable-btn {
            width: 36px;
            height: 36px;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            cursor: pointer;
            background-size: 28px 28px;
            background-repeat: no-repeat;
            background-position: center;
            background-color: var(--surface-color);
            transition: all 0.2s ease;
        }
        .inkable-btn.active {
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px var(--accent-gold-glow);
        }

        .clear-filters-btn {
            font-size: 12px;
            padding: 4px 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--surface-color);
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            line-height: 1;
        }
        .clear-filters-btn:hover {
            border-color: var(--accent-gold);
            color: #fff;
            background: rgba(245, 196, 81, 0.1);
        }

        /* Le reste du CSS (grid, modal, etc.) est strictement identique aux versions précédentes */
        /* … (je le raccourcis ici par souci de place, mais tu dois conserver tout ton CSS actuel) … */
    </style>
</head>
<body>
    <!-- HEADER identique, avec les nouveaux boutons -->
    <header class="header">
        <div class="header-container">
            <div class="header-top">
                <!-- … marque, recherche, langue … -->
            </div>
            <div class="header-filters">
                <div class="filter-group">
                    <label for="set">Extension</label>
                    <select id="set"><option value="all">Toutes</option></select>
                </div>
                <div class="filter-group">
                    <label>Couleurs</label>
                    <div class="icon-buttons" id="colorButtonsContainer"></div>
                </div>
                <div class="filter-group">
                    <label>Coût</label>
                    <div class="icon-buttons" id="costButtonsContainer"></div>
                </div>
                <div class="filter-group">
                    <label>Encre</label>
                    <div class="icon-buttons" id="inkableButton"></div>
                </div>
                <div class="filter-group">
                    <label for="sort">Tri</label>
                    <select id="sort">
                        <option value="name-asc">Nom A-Z</option>
                        <option value="name-desc">Nom Z-A</option>
                        <option value="cost-asc">Coût ↑</option>
                        <option value="cost-desc">Coût ↓</option>
                    </select>
                </div>
                <button class="clear-filters-btn" id="resetFiltersBtn">✕ Réinitialiser</button>
            </div>
        </div>
    </header>

    <!-- … stats, loading, grid, pagination, footer, modale (identiques) … -->

    <script>
        // ---------- SVG EN DATA URI ----------
        const colorSVGDataURIs = { /* … (inchangé) … */ };

        // Icône hexagonale pour les coûts (fournie par toi)
        const costHexSVG = "data:image/svg+xml," + encodeURIComponent(`<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg"><polygon points="24,56 100,12 176,56 176,144 100,188 24,144" fill="#000000" stroke="#d4b889" stroke-width="12" /></svg>`);

        // Icône Inkwell (fournie par toi)
        const inkwellSVG = "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 112"><path fill="#000" d="M63.6 16.5l29.4 17v34L63.6 89.5l-29.3-17v-34l29.3-16.9z"/><path fill="#d4b889" d="M63.6 16.5l34 19.6v39.1l-34 19.6-33.9-19.6V36.1l34-19.6zm0 5.2l29.4 17v34L63.6 89.5l-29.3-17v-34l29.3-16.9zM66.4 96.5L97 78.8a.6.6 0 01.9.6c-.6 5.4-2.9 19.9-8.5 24.8-.9.7-1.7 1.6-2.8 2.1a55 55 0 01-23 5h-.3a55.7 55.7 0 01-50-32 1 1 0 011.4-1.3 82 82 0 0033.4 11.4c.7 0 1.3.2 1.8.5l11.6 7s1 3.5 1.9 4.6c0 0 .5-2.2 3-5zM100 52.2a.6.6 0 01-.3-.5V39.4a.6.6 0 011-.5c5 2.9 16 15 14.1 38 0 .5 0 .8-.2 1.2A55.9 55.9 0 0198 99.4a.8.8 0 01-1.2-1 54 54 0 003.6-22v-18a391 391 0 014.4-3.7c-.7-.2-3.2-1.4-4.8-2.5zM10 70.1c-.5-1.9-1-3.7-1.2-5.7-1.2-4-6.3-7.4-8.4-8.6a.5.5 0 010-1c5.5-2.3 7.7-6 8.1-6.7A76 76 0 0027 75.8v.5c0 .4.1.7.4.8l15 7.7V86h-.1A61 61 0 019.9 70.1zM27.6 60v11.3c0 .3-.1.5-.4.6s-1.2-.3-1.4-.5c-1.7-1.8-4.4-5.3-9-12.2a36.1 36.1 0 01-6.5-19.3 55.8 55.8 0 0140-38.3.5.5 0 01.5.9 50.6 50.6 0 00-18 29.6L28 34.4a1 1 0 00-.4.8V52a20 20 0 01-5.3 2.5s4 3.2 5.2 5.5zm72.8-25a1 1 0 00-.5-.8L79.8 22.5a.3.3 0 01.1-.6c20.6-1.1 30.1 5.8 33.5 9l.4.7c2.5 5 4.1 10.5 5 16.3 0 0 2 4.3 8.2 7a.5.5 0 010 .9c-2.1 1.2-7.2 4.5-8.4 8.6a1 1 0 01-1.9 0c0-1.8-.2-3.7-.4-5.8A36.9 36.9 0 00100.4 35zM61.6 14.7L36.4 29a.3.3 0 01-.4-.3C39 13.7 52.5 4.4 55.8 2L58.5.3l.6-.1 4.5-.2h.4a55.6 55.6 0 0146.6 25.8v.4a66.9 66.9 0 00-36.1-6.8l-8.2-4.7c-1.7-1.9-2.7-5.4-2.7-5.4-1.4 1.1-2 5.4-2 5.4z"/></svg>`);

        // ---------- ÉTAT DES FILTRES ----------
        let selectedColors = new Set();
        let selectedCosts = new Set();   // '1'...'8', '9+'
        let onlyInkable = false;        // true = n'afficher que les cartes encrables

        // ---------- CONSTRUCTION DES BOUTONS ----------
        function buildColorButtons() {
            const container = document.getElementById('colorButtonsContainer');
            container.innerHTML = '';
            colorOrder.forEach(color => {
                const btn = document.createElement('div');
                btn.className = 'color-btn';
                btn.style.backgroundImage = `url('${colorSVGDataURIs[color]}')`;
                btn.title = translations[currentLanguage].colorNames[color] || color;
                btn.dataset.color = color;
                btn.addEventListener('click', () => toggleColor(color, btn));
                container.appendChild(btn);
            });
        }

        function buildCostButtons() {
            const container = document.getElementById('costButtonsContainer');
            container.innerHTML = '';
            for (let i = 1; i <= 8; i++) {
                const btn = document.createElement('div');
                btn.className = 'cost-btn';
                btn.style.backgroundImage = `url('${costHexSVG}')`;
                btn.textContent = i;
                btn.dataset.cost = i;
                btn.addEventListener('click', () => toggleCost(i, btn));
                container.appendChild(btn);
            }
            // Bouton 9+
            const btn9 = document.createElement('div');
            btn9.className = 'cost-btn';
            btn9.style.backgroundImage = `url('${costHexSVG}')`;
            btn9.textContent = '9+';
            btn9.dataset.cost = '9+';
            btn9.addEventListener('click', () => toggleCost('9+', btn9));
            container.appendChild(btn9);
        }

        function buildInkableButton() {
            const container = document.getElementById('inkableButton');
            container.innerHTML = '';
            const btn = document.createElement('div');
            btn.className = 'inkable-btn';
            btn.style.backgroundImage = `url('${inkwellSVG}')`;
            btn.title = 'Filtrer cartes encrables';
            btn.addEventListener('click', () => {
                onlyInkable = !onlyInkable;
                btn.classList.toggle('active');
                applyFiltersAndDisplay();
            });
            container.appendChild(btn);
        }

        function toggleColor(color, btn) {
            if (selectedColors.has(color)) {
                selectedColors.delete(color);
                btn.classList.remove('active');
            } else {
                selectedColors.add(color);
                btn.classList.add('active');
            }
            applyFiltersAndDisplay();
        }

        function toggleCost(cost, btn) {
            const key = String(cost);
            if (selectedCosts.has(key)) {
                selectedCosts.delete(key);
                btn.classList.remove('active');
            } else {
                selectedCosts.add(key);
                btn.classList.add('active');
            }
            applyFiltersAndDisplay();
        }

        function resetAllFilters() {
            selectedColors.clear();
            selectedCosts.clear();
            onlyInkable = false;
            document.querySelectorAll('.color-btn, .cost-btn, .inkable-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('set').value = 'all';
            document.getElementById('sort').value = 'name-asc';
            document.getElementById('search').value = '';
            applyFiltersAndDisplay();
        }

        // ---------- FILTRAGE ----------
        function applyFiltersAndDisplay() {
            if (!allCards.length) return;
            const selectedSet = document.getElementById('set').value;
            const searchTerm = document.getElementById('search').value.toLowerCase().trim();
            const [sortField, sortOrder] = document.getElementById('sort').value.split('-');

            let filtered = allCards.slice();
            if (selectedSet !== 'all') filtered = filtered.filter(c => c.setCode === selectedSet);

            // Couleurs
            if (selectedColors.size > 0) {
                filtered = filtered.filter(c => {
                    const cardColors = c.color.split('-').map(x => getEnglishColorName(x.trim()));
                    return cardColors.some(color => selectedColors.has(color));
                });
            }

            // Coûts (union)
            if (selectedCosts.size > 0) {
                filtered = filtered.filter(c => {
                    const cost = c.cost || 0;
                    return [...selectedCosts].some(sc => {
                        if (sc === '9+') return cost >= 9;
                        return cost === parseInt(sc);
                    });
                });
            }

            // Encreable
            if (onlyInkable) {
                filtered = filtered.filter(c => c.inkwell === true);
            }

            // Recherche
            if (searchTerm) filtered = filtered.filter(c => c.searchText && c.searchText.includes(searchTerm));

            // Tri
            filtered.sort((a, b) => {
                let valA = sortField === 'name' ? (a.name || '').toLowerCase() : (a.cost || 0);
                let valB = sortField === 'name' ? (b.name || '').toLowerCase() : (b.cost || 0);
                if (valA < valB) return sortOrder === 'asc' ? -1 : 1;
                if (valA > valB) return sortOrder === 'asc' ? 1 : -1;
                return 0;
            });

            // Groupes (variantes)
            const groups = new Map();
            filtered.forEach(card => {
                const key = card.fullName || `${card.name} - ${card.version}`;
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(card);
            });
            uniqueCardList = Array.from(groups, ([, variants]) => ({ representative: variants[0], variants }));
            document.getElementById('displayedCards').textContent = uniqueCardList.length;
            currentPage = 1;
            renderPage();
        }

        // ---------- INITIALISATION ----------
        function initApp() {
            buildColorButtons();
            buildCostButtons();
            buildInkableButton();
            applyUILanguage('fr');
            loadCards('fr');
            document.getElementById('resetFiltersBtn').addEventListener('click', resetAllFilters);
        }

        initApp();
    </script>
</body>
</html>
