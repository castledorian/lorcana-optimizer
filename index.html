<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lorcana Card Viewer Pro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header" id="header"></header>

    <div class="stats" id="stats" style="display: none;">
        <div>Total : <span class="stat-value" id="totalCards">0</span></div>
        <div>Affichées : <span class="stat-value" id="displayedCards">0</span></div>
        <div>Extensions : <span class="stat-value" id="totalSets">0</span></div>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <span id="loadingText">Chargement des cartes...</span>
    </div>

    <div class="cards-grid" id="cardsGrid"></div>

    <div class="pagination" id="pagination" style="display: none;">
        <button id="prevPage">← Précédent</button>
        <span class="page-info" id="pageInfo">Page 1</span>
        <button id="nextPage">Suivant →</button>
    </div>

    <footer class="footer">
        Données fournies par <a href="https://lorcanajson.org" target="_blank">Lorcanajson.org</a> — Lorcana Card Viewer Pro
    </footer>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">Détails de la carte</div>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="variant-nav" id="variantNav" style="display: none;">
                <button id="prevVariant">← Variante précédente</button>
                <span class="variant-count" id="variantCount">1 / 1</span>
                <button id="nextVariant">Variante suivante →</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
