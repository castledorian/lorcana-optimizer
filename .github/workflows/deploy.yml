name: Deploy to GitHub Pages

on:
  push:
    branches: [main]   # ou master selon ta branche

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # ← plus long que les 10 min par défaut

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Optionnel : minifier les JSON pour accélérer le transfert
      - name: Minify JSON data
        run: |
          for file in data/*.json; do
            echo "Minifying $file"
            npx json-minify "$file" > "$file.tmp" && mv "$file.tmp" "$file"
          done

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          force_orphan: true
